{% macro tag_picker(name='tags', initial='', existing=[], colors={}, placeholder='选择已有标签，或输入后回车新建', multiple=false) %}
<div class="tag-picker" x-data='tagPicker({{ initial|tojson }}, {{ existing|tojson }}, {{ colors|tojson }}, {{ multiple|tojson }})'
     @click.outside="open=false"
     @keydown.escape="open=false"
     @focusout="if (!$event.relatedTarget || !$el.contains($event.relatedTarget)) open = false">
  <div class="tag-chips">
    <template x-for="tag in tags" :key="tag">
      <span class="tag-chip tag-colored" :style="'--tag-color:' + colorFor(tag)">
        <span x-text="tag"></span>
        <button type="button" @click="remove(tag)" aria-label="移除标签">×</button>
      </span>
    </template>
    <span class="muted-sm" x-show="!tags.length">还没有标签</span>
  </div>
  <div class="tag-picker-box" :class="open ? 'is-open' : ''">
    <input class="input" type="text" x-model="draft"
           @focus="open=true" @click="open=true" @input="open=true"
           @keydown.enter.prevent="add()"
           :list="'tag-suggest-{{ name }}'"
           placeholder="{{ placeholder }}">
    <datalist id="tag-suggest-{{ name }}">
      {% for tag in existing %}<option value="{{ tag }}"></option>{% endfor %}
    </datalist>
    <button type="button" class="tag-picker-toggle" aria-label="展开标签"
            @mousedown.prevent @click="open=!open">▾</button>
    <div class="tag-suggest-list" x-show="open" x-cloak>
      <template x-for="tag in suggestions" :key="tag">
        <button type="button" class="tag-chip tag-colored tag-suggest"
                :style="'--tag-color:' + colorFor(tag)"
                @mousedown.prevent @click="pick(tag)" x-text="tag"></button>
      </template>
      <p class="muted-sm" x-show="!suggestions.length">输入名称后回车即可新建标签</p>
    </div>
  </div>
  <input type="hidden" name="{{ name }}" :value="tags.join(',')">
</div>
{% endmacro %}
