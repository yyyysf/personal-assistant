<section class="panel">
  <header class="panel-head">
    <div><h2>Due Days</h2><p class="panel-sub">截止倒计时</p></div>
    <button class="btn btn-tiny btn-ghost" type="button"
            data-modal-url="/schedule/due/new" data-modal-title="新增截止事项">+ 截止</button>
  </header>
  <div class="due-list">
    {% for row in due_rows %}
    <div class="due-row{{ ' is-done' if row.item.done }}">
      <div class="due-main">
        <span class="due-title{{ ' is-done' if row.item.done }}">{{ row.item.title }}</span>
        <span class="due-date">{{ row.item.due_date|d }}</span>
      </div>
      <span class="due-chip due-chip--{{ row.level }}">{{ row.label }}</span>
      <div class="due-actions">
        <form hx-post="/schedule/due/{{ row.item.id }}/toggle" hx-swap="none">
          <button class="icon-btn" type="submit" title="{{ '标记未完成' if row.item.done else '标记完成' }}">
            {{ '↺' if row.item.done else '✓' }}
          </button>
        </form>
        <form hx-post="/schedule/due/{{ row.item.id }}/delete" hx-swap="none"
              hx-confirm="删除截止事项「{{ row.item.title }}」？">
          <button class="icon-btn" type="submit" title="删除">✕</button>
        </form>
      </div>
    </div>
    {% else %}
    <p class="empty-inline">暂无截止事项，点击「+ 截止」记录一个 deadline。</p>
    {% endfor %}
  </div>
</section>

<section class="panel">
  <header class="panel-head">
    <div><h2>Memos</h2><p class="panel-sub">置顶的灵感与待办</p></div>
  </header>
  <form class="memo-form" hx-post="/schedule/memos/new" hx-swap="none"
        hx-on::after-request="if (event.detail.successful) this.reset()">
    <textarea name="content" rows="2" maxlength="2000" placeholder="记一条临时想法…" required></textarea>
    <button class="btn btn-tiny btn-primary" type="submit">添加</button>
  </form>
  <div class="memo-list">
    {% for memo in memos %}
    <div class="memo-card{{ ' is-pinned' if memo.pinned }}">
      <p>{{ memo.content }}</p>
      <div class="memo-actions">
        <span class="memo-date">{{ memo.created_at|dt('%m-%d %H:%M') }}</span>
        <form hx-post="/schedule/memos/{{ memo.id }}/pin" hx-swap="none">
          <button class="icon-btn memo-pin" type="submit"
                  title="{{ '取消置顶' if memo.pinned else '置顶' }}">{{ '★' if memo.pinned else '☆' }}</button>
        </form>
        <form hx-post="/schedule/memos/{{ memo.id }}/delete" hx-swap="none" hx-confirm="删除这条备忘录？">
          <button class="icon-btn" type="submit" title="删除">✕</button>
        </form>
      </div>
    </div>
    {% else %}
    <p class="empty-inline">还没有备忘录。</p>
    {% endfor %}
  </div>
</section>
