{% from "components/tag_picker.html" import tag_picker %}
{% set is_edit = trip is not none %}
<form class="stack-form"
      hx-post="{{ '/travel/trips/' ~ trip.id ~ '/edit' if is_edit else '/travel/trips/new' }}"
      hx-target="#modal-body" hx-swap="innerHTML">
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

  <div class="field-row">
    <label class="field">
      <span>行程标题</span>
      <input type="text" name="title" maxlength="200" required
             value="{{ values.title }}" placeholder="例如：京都赏樱 4 日">
    </label>
    <label class="field">
      <span>状态</span>
      <select name="status">
        {% for value, label in statuses.items() %}
        <option value="{{ value }}" {{ 'selected' if values.status == value }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span>分类</span>
      <select name="category">
        <option value="">不分类</option>
        {% for name in categories %}
        <option value="{{ name }}" {{ 'selected' if values.category == name }}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div class="field-row">
    <label class="field">
      <span>开始日期</span>
      <input class="input" type="date" name="start_date" value="{{ values.start_date }}">
    </label>
    <label class="field">
      <span>结束日期</span>
      <input class="input" type="date" name="end_date" value="{{ values.end_date }}">
    </label>
  </div>

  <div class="field">
    <span>标签</span>
    {{ tag_picker('tags', values.tags, tag_options) }}
  </div>

  <label class="field">
    <span>行程安排</span>
    <textarea name="itinerary" rows="5"
              placeholder="D1 抵达…&#10;D2 …">{{ values.itinerary }}</textarea>
  </label>

  <label class="field">
    <span>备注</span>
    <input type="text" name="notes" maxlength="500" value="{{ values.notes }}"
           placeholder="预算、交通、住宿">
  </label>

  <div class="modal-actions">
    <button class="btn btn-ghost" type="button" data-modal-close>取消</button>
    <button class="btn btn-primary" type="submit">{{ '保存修改' if is_edit else '保存行程' }}</button>
  </div>
</form>
