<form class="stack-form" hx-post="/schedule/due/new" hx-target="#modal-body" hx-swap="innerHTML">
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

  <label class="field">
    <span>事项名称</span>
    <input type="text" name="title" maxlength="200" required value="{{ values.title }}"
           placeholder="例如：论文投稿截止">
  </label>

  <div class="field-row">
    <label class="field">
      <span>截止日期</span>
      <input type="date" name="due_date" required value="{{ values.due_date }}">
    </label>
    <label class="field">
      <span>关联项目（可选）</span>
      <select name="project_id">
        <option value="">不关联</option>
        {% for project in projects %}
        <option value="{{ project.id }}"
                {{ 'selected' if values.project_id|string == project.id|string }}>{{ project.name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <label class="field">
    <span>备注（可选）</span>
    <textarea name="note" rows="3" placeholder="需要提前准备的材料或提醒">{{ values.note }}</textarea>
  </label>

  <div class="modal-actions">
    <button class="btn btn-ghost" type="button" data-modal-close>取消</button>
    <button class="btn btn-primary" type="submit">创建截止事项</button>
  </div>
</form>
