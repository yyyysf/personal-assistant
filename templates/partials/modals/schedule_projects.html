<section class="stack">
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <header class="modal-section-head">
    <div>
      <h3>项目管理</h3>
      <p class="muted-sm">项目为主时间线上色，子项目在任务表单中创建</p>
    </div>
    <button class="btn btn-tiny btn-primary" type="button"
            data-modal-url="/schedule/projects/new" data-modal-title="新增项目">+ 项目</button>
  </header>

  <div class="project-list">
    {% for project in projects %}
    <div class="project-row">
      <span class="project-dot project-dot--lg" style="--project-color: {{ project.color }}"></span>
      <div class="project-main">
        <strong>{{ project.name }}</strong>
        <span class="muted-sm">
          {% for subproject in project.subprojects %}<span class="tag">{{ subproject.name }}</span>{% else %}暂无子项目{% endfor %}
        </span>
      </div>
      <div class="project-actions">
        <button class="icon-btn" type="button" title="编辑"
                data-modal-url="/schedule/projects/{{ project.id }}/edit"
                data-modal-title="编辑项目">✎</button>
        <form hx-post="/schedule/projects/{{ project.id }}/delete" hx-swap="none"
              hx-confirm="删除项目「{{ project.name }}」？">
          <button class="icon-btn" type="submit" title="删除">✕</button>
        </form>
      </div>
    </div>
    {% else %}
    <p class="empty-inline">还没有项目，先创建一个，给时间线上色。</p>
    {% endfor %}
  </div>

  <div class="modal-actions">
    <button class="btn btn-ghost" type="button" data-modal-close>关闭</button>
  </div>
</section>
