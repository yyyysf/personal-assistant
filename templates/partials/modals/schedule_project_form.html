{% set is_edit = project is not none %}
<form class="stack-form"
      hx-post="{{ '/schedule/projects/' ~ project.id ~ '/edit' if is_edit else '/schedule/projects/new' }}"
      hx-target="#modal-body" hx-swap="innerHTML">
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

  <label class="field">
    <span>项目名称</span>
    <input type="text" name="name" maxlength="60" required value="{{ values.name }}"
           placeholder="例如：科研 / 副业 / 生活">
  </label>

  <label class="field">
    <span>项目颜色</span>
    <input type="color" name="color" value="{{ values.color }}">
  </label>

  <div class="modal-actions">
    <button class="btn btn-ghost" type="button" data-modal-close>取消</button>
    <button class="btn btn-primary" type="submit">{{ '保存修改' if is_edit else '创建项目' }}</button>
  </div>
</form>
